# ══════════════════════════════════════════════════════════════════
#  求职系统 · nginx 站点配置
#
#  统一入口：
#    * 静态资源（上级目录 job-web/）由 nginx 直接吐
#    * /api/  → Java 业务后端 127.0.0.1:8080
#                （AI 请求也走这里：Java 的 /user/agent/** 会转发给 Python Agent）
#
#  ⚠️ 为什么监听 81 而不是 80：
#     这台机器上「边坡监测系统」的 nginx 已经占了 80，而且它的 Java/Agent
#     也用了 8080/8000 —— **两个项目用的是同一组端口**。
#     nginx 用 81 可以让两个前端互不影响；Java/Agent 的冲突由启动脚本显式处理
#     （检测到被另一个项目占用时会提示，不会静默失败）。
#
#  启动（必须带 -p 指定 prefix，否则找不到 conf/mime.types 与 logs/temp）：
#    nginx.exe -p D:\develop_software\nginx-1.20.2 -c <本文件绝对路径>
# ══════════════════════════════════════════════════════════════════

worker_processes  2;
error_log  logs/job-error.log  warn;
pid        logs/job-nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  job  '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent ${request_time}s '
                     'upstream=${upstream_addr} ut=${upstream_response_time}s';
    access_log  logs/job-access.log  job;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 10m;     # 简历文件上传要留余量

    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;

    # ⚠️ 只有**一个** upstream 时，不要配 max_fails/fail_timeout！
    #
    #   max_fails 的本意是**多台服务器之间做故障转移**：这台挂了换下一台。
    #   但这里只有一台 Java，标记它下线 = 没有可切换的目标 = **全站 502**。
    #
    #   实测代价：压测到 40 并发时出现几个瞬时失败，
    #   nginx 立刻把 job_java 标记下线 10 秒（fail_timeout），
    #   整个 6 秒的压测窗口内**所有请求都拿到 502**（错误率 99%），
    #   看起来像"服务端扛不住"，实际上服务端可能一点事都没有。
    #
    #   所以这里显式关掉健康检查（max_fails=0 表示不统计失败次数）。
    #   真要配故障转移，应该在**有多个** upstream 时再开。
    # ══════════════════════════════════════════════════════════════
    #  限流：令牌桶算法（nginx 的 limit_req 就是漏桶/令牌桶思路）
    #
    #  为什么限在 API 层（location /api/）而不是全站：
    #    * 静态资源由强缓存兜住，本来就不该占限流额度
    #    * 我们要保护的是 Java + MySQL，也就是 /api/ 这条链路
    #
    #  参数怎么定：
    #    rate=100r/s   每秒 100 个请求的平均速率（超出就排队/拒绝）
    #    burst=200     允许瞬时突发 200 个（页面打开会连发多个请求，得给余量）
    #    nodelay       突发额度内**立即放行**，不排队等待 ——
    #                  不加的话超出平均速率的请求会被"攒着慢慢放"，
    #                  用户看到的是变慢而不是"太火爆"，体验更差
    #
    #  为什么用 429 而不是 503：
    #    503 语义是"服务不可用"（通常是上游挂了），客户端会以为要重试；
    #    429 Too Many Requests 明确告诉调用方"你被限流了，退避再来"，
    #    这才是正确的语义。前端拿到 429 应该提示"操作太频繁"而不是"服务故障"。
    # ══════════════════════════════════════════════════════════════
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=100r/s;
    limit_req_status 429;

    upstream job_java {
        server 127.0.0.1:8080 max_fails=0;
        keepalive 32;            # 到后端的连接复用，减少握手开销
    }

    server {
        listen       81;
        server_name  localhost 127.0.0.1;

        # 前端站点根目录（本文件在 job-web/deploy/ 下，所以往上一级）
        root   C:/Users/Lenovo/Desktop/Find_job/job-web;
        index  index.html;

        charset utf-8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 文件名没带 hash，缓存期要短 —— 否则改完 JS/CSS 刷不出来
        location ~* \.(css|js)$ {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }
        location ~* \.(svg|png|jpg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # ── Java 业务后端（含 AI 转发）──
        #
        # ⚠️ proxy_pass 末尾必须是**单个斜杠**（`http://job_java/`），不能是 `/api/`。
        #    规则：proxy_pass 里带 URI 时，nginx 用它**替换** location 匹配到的那一段。
        #      location /api/ + proxy_pass http://job_java/api/  → /api/user/stats 原样转发
        #      location /api/ + proxy_pass http://job_java/      → /api/ 被替换成 / → /user/stats
        #    而 **Java 后端没有 /api 这个 context-path**：
        #      * application.yml 里没有 server.servlet.context-path
        #      * 控制器就是 @RequestMapping("/user/stats")、("/admin/employee/login")
        #      * 小程序 utils/request.js 也是 baseUrl='http://localhost:8080' 直接拼 '/user/job/list'
        #    所以写成 /api/ 会让**所有接口 404**。这里用末尾单斜杠，
        #    正好把「前端用 /api 前缀」和「后端真实无前缀」两边对齐。
        #
        # ⚠️ 超时要给够：
        #   * 手动爬虫 /admin/crawl/run → 实测 1~3 分钟
        #   * AI /user/agent/chat       → 实测 20~120 秒（ReAct + RAG）
        #   nginx 默认 proxy_read_timeout 只有 60 秒，不改这两类请求会 504，
        #   而且现象是"页面报超时、后端其实还在跑"，很难排查。
        location /api/ {
            # 令牌桶限流：超出 burst 直接 429（原因见 http 块里的说明）
            limit_req          zone=api_limit burst=200 nodelay;
            # 被限流时给前端一个明确的 JSON，而不是 nginx 默认的 HTML 错误页 ——
            # 前端统一按 JSON 解析，返回 HTML 会让它解析失败、报"网络错误"，
            # 掩盖掉真正的原因。
            limit_req_status   429;

            proxy_pass         http://job_java/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
            proxy_buffering       off;   # 长回答尽早开始回传
        }

        location = /nginx-health {
            access_log off;
            return 200 "job-web nginx ok\n";
            add_header Content-Type text/plain;
        }

        # 429 的响应体也返回 JSON。
        #
        # 为什么必须自定义：nginx 默认返回的是 HTML 错误页，
        # 而前端所有请求都按 JSON 解析（`response.json()`），
        # 拿到 HTML 会解析失败 → 前端弹出"网络错误"，
        # 把"被限流了"这个真实原因完全掩盖掉，排查时特别费劲。
        error_page 429 = @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            return 429 '{"code":429,"msg":"请求过于频繁，请稍后再试","data":null}';
        }
    }
}
